name: build-dylibs
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build bs_unlock.dylib
        run: |
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -O2 \
            -miphoneos-version-min=13.0 -framework Foundation -framework Security \
            -install_name @rpath/bs_unlock.dylib \
            bs_unlock.m fishhook.c -o bs_unlock.dylib
          codesign -f -s - bs_unlock.dylib
      - name: Build bs_test.dylib
        run: |
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -O2 \
            -miphoneos-version-min=13.0 -framework Foundation \
            -install_name @rpath/bs_test.dylib \
            bs_test.m -o bs_test.dylib
          codesign -f -s - bs_test.dylib
      # ★ v6.40：断网恢复自启的状态机回归（不依赖真机，纯逻辑仿真）
      #   断言 A 组：断网 3min/10min/1h 恢复后 [ar] 都能自己接上（含 disarm 链路）
      #   断言 B 组：v6.38 与 v6.39 必须都复现「永不恢复」，证明这条 bug 真存在
      #   断言 C 组：人停 / 封禁 / 超窗 三种情况必须仍然 gate（防「修完变成人停也拉」）
      - name: Netloss resume state machine test
        run: python3 _netloss_test.py
      - name: Sanity strings
        run: |
          strings bs_unlock.dylib | grep -q "keyhunt" || (echo "MISSING keyhunt" && exit 1)
          strings bs_unlock.dylib | grep -q "v6.52" || (echo "MISSING v6.52" && exit 1)
          if strings bs_unlock.dylib | grep -q "v6.41"; then echo "STALE: v6.41 banner still present" && exit 1; fi
          strings bs_unlock.dylib | grep -q "loads on next script start" || (echo "MISSING so disk-only note" && exit 1)
          if strings bs_unlock.dylib | grep -q "v6.24s"; then echo "STALE: v6.24s string still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6.25a"; then echo "STALE: v6.25a string still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6.25b"; then echo "STALE: v6.25b string still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6.25c"; then echo "STALE: v6.25c string still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6.25d"; then echo "STALE: v6.25d string still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6.25e"; then echo "STALE: v6.25e string still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6.25f"; then echo "STALE: v6.25f string still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6.25g"; then echo "STALE: v6.25g string still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6.25h"; then echo "STALE: v6.25h string still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6.25i"; then echo "STALE: v6.25i string still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6.25j"; then echo "STALE: v6.25j string still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6.26"; then echo "STALE: v6.26 string still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6.27"; then echo "STALE: v6.27 string still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6.28"; then echo "STALE: v6.28 string still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6.29"; then echo "STALE: v6.29 string still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6.30"; then echo "STALE: v6.30 string still present" && exit 1; fi
          # ===== v6.31：resume 回执 + 失败分类 + 硬失败收敛（脚本「点了还是没起来」的处理）=====
          # 1) 回执窗口：点了一次运行，90s 内 st!=0 才算点着
          strings bs_unlock.dylib | grep -q "verified (st!=0)" || (echo "MISSING v6.31 resume verify-ok log" && exit 1)
          strings bs_unlock.dylib | grep -q "NOT started in %ds" || (echo "MISSING v6.31 resume verify-fail log" && exit 1)
          # 2) 失败分类四类 + 各自动作
          strings bs_unlock.dylib | grep -q "cls=fg -> uiopen" || (echo "MISSING v6.31 fg class action" && exit 1)
          strings bs_unlock.dylib | grep -q "cls=module -> wait puller" || (echo "MISSING v6.31 module class action" && exit 1)
          strings bs_unlock.dylib | grep -q "hard=%d/%d -> keep retrying" || (echo "MISSING v6.31 hard counter log" && exit 1)
          # 3) 硬失败收敛：连续 2 次没点着 → 静默 6h，不再每 48min 空转一轮
          strings bs_unlock.dylib | grep -q "HARD FAIL att=%d" || (echo "MISSING v6.31 hard-fail banner" && exit 1)
          strings bs_unlock.dylib | grep -q "hard-fail window over" || (echo "MISSING v6.31 hard-fail expiry" && exit 1)
          # 4) crashresume 真闸门接回（v6.28 漏接导致该开关空转一整版）
          strings bs_unlock.dylib | grep -q "crashresume=%d" || (echo "MISSING crashresume conf log" && exit 1)
          # ===== v6.32：中控点停止被 2 秒拉起（216 实证 2026-10-22 14:58）=====
          # 根因：1->0 只按 sjz.log mtime 判「人停 / 自停」，脚本挂机无输出时 mtime 早就
          # 超过 300s → 中控点停止被误判成 self-stop → [ar] 立刻 OPER_START。
          # 修法：stop 来源的第一证据改成 agent.log（bs_ar_stop_kind），并加实时复查闸门。
          strings bs_unlock.dylib | grep -q "stop evidence: agent.log = center/user stop" || (echo "MISSING v6.32 stop evidence log" && exit 1)
          strings bs_unlock.dylib | grep -q "resume BLOCKED: live agent.log says center/user stop" || (echo "MISSING v6.32 live stop gate" && exit 1)
          strings bs_unlock.dylib | grep -q "stop-log-live" || (echo "MISSING v6.32 live stop ar state" && exit 1)
          strings bs_unlock.dylib | grep -q "sjz=%lds sk=%d st=%p" || (echo "MISSING v6.32 sk in stop log" && exit 1)
          strings bs_unlock.dylib | grep -q "run 1->0 sk=%d(%s) sjz=%lds" || (echo "MISSING v6.33 sk class in self-stop log" && exit 1)
          strings bs_unlock.dylib | grep -q "sjz=%lds rk=%d" || (echo "MISSING v6.32 rk in arm log" && exit 1)
          # ===== v6.33：厂商因脚本报错停脚本，不许被判成「用户停止」=====
          # 216 历史实证（2026-10-21 21:54:31 agent.log 第 15625 行附近）：
          #   run script error:[string "..."]:1: bs_module_lost:task_lhdb_into!
          #   agent stop script
          # v6.32 的 sk==2 会把这条判成用户停止 → .bs_userstop + disarmed → 永不拉起。
          # 修法：stop 前 4KB 窗口内追加脚本层错误签名 → kind=4，且签名必须晚于最后一次 run。
          strings bs_unlock.dylib | grep -q "vendor-error-stop" || (echo "MISSING v6.33 vendor-error-stop class" && exit 1)
          strings bs_unlock.dylib | grep -q "bs_module_lost" || (echo "MISSING v6.33 bs_module_lost signature" && exit 1)
          strings bs_unlock.dylib | grep -q "load snail module failed" || (echo "MISSING v6.33 loadfail signature" && exit 1)
          strings bs_unlock.dylib | grep -q "can not find version key" || (echo "MISSING v6.33 versionkey signature" && exit 1)
          # ===== v6.34：自停不许抹模块（抹了 resume 必然 bs_module_lost 死循环）=====
          #   8167（57bebc06）2026-10-22 16:45 `bs_module_lost:task_lhdb_into` 就是这个形态：
          #   自停 → 抹模块 → 再运行 → require 不到 → 厂商又停 → v6.31 判人停 → 永久躺平。
          strings bs_unlock.dylib | grep -q "self-stop -> KEEP %d local module(s) for auto-resume" || (echo "MISSING v6.34 keep-modules log" && exit 1)
          strings bs_unlock.dylib | grep -q "resume precheck: 0 local module(s)" || (echo "MISSING v6.34 resume precheck log" && exit 1)
          if strings bs_unlock.dylib | grep -q "v6.34"; then echo "STALE: v6.34 string still present" && exit 1; fi
          # ===== v6.36：注入之后盘上才补回模块 -> 每 MOD_SYNC_SECS 比对盘面并补注 =====
          #   216 实证 21:05:26 注入 n=2，1s 后真模块回来但 dict/st 没变 -> 白卡 302s 才崩。
          strings bs_unlock.dylib | grep -q "resync: disk=%d last=%d -> re-inject" || (echo "MISSING v6.36 resync log" && exit 1)
          strings bs_unlock.dylib | grep -q "resync will re-inject once state appears (v6.36)" || (echo "MISSING v6.36 precheck hint" && exit 1)
          if strings bs_unlock.dylib | grep -q "v6.35"; then echo "STALE: v6.35 string still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6.33"; then echo "STALE: v6.33 string still present" && exit 1; fi
          # ===== v6.37：probe 默认「只拉不传」（.98 上报 030102 顶飞全网 280+ 台驱动）=====
          #   2026-10-22 23:44:22.599 .98 probe 报 030102 → 7ms 后云端落盘 → bs_so_sync
          #   只升不降把全网顶到厂商原版（AUTO_HARDEN=False）→ 8105 func-nil 死亡循环。
          #   修法：probe 上行默认关（conf probeupl=，缺省 0），只保留 GET /ver 跟版下载。
          strings bs_unlock.dylib | grep -q "probeupl" || (echo "MISSING v6.37 probeupl conf key" && exit 1)
          strings bs_unlock.dylib | grep -q "upload DISABLED (probeupl=0)" || (echo "MISSING v6.37 probe upload-off banner" && exit 1)
          strings bs_unlock.dylib | grep -q "upload off, local watch only" || (echo "MISSING v6.37 local version watch" && exit 1)
          strings bs_unlock.dylib | grep -q "pull-only follow ON" || (echo "MISSING v6.37 probe pull-only follow" && exit 1)
          strings bs_unlock.dylib | grep -q "follow disabled (fully passive)" || (echo "MISSING v6.37 passive branch" && exit 1)

          # ===== v6.38：「加载运行库出错」自愈三件套（1055/1056 新机批量实证驱动）=====
          strings bs_unlock.dylib | grep -q "local beta.so MISSING/unreadable -> force full sync (self-heal)" || (echo "MISSING v6.38 missing-so milestone" && exit 1)
          strings bs_unlock.dylib | grep -q "self-heal: no local beta.so -> download ver=" || (echo "MISSING v6.38 force-download branch" && exit 1)
          strings bs_unlock.dylib | grep -q "post-write keys ready:" || (echo "MISSING v6.38 post-write key warmup" && exit 1)
          strings bs_unlock.dylib | grep -q "pid=%d (suppress 300s)" || (echo "MISSING v6.38 errno log dedup" && exit 1)
          if strings bs_unlock.dylib | grep -q "local beta.so unreadable -> skip sync"; then echo "STALE: v6.37 skip-sync branch still present" && exit 1; fi

          # ===== v6.39：断网恢复后脚本不自启（2026-10-24 断网事故根因，四条链路）=====
          #   ① puller tick=60 + hbmiss=3 → 断网 3 分钟就 killswitch；
          #   ② killswitch 无条件抹模块 → 恢复后撞 bs_module_lost 二次躺平；
          #   ③ run 1->0 无条件清 ar.lst → [ar] 入口 ar.armed && ar.lst 永不成立；
          #   ④ AR_KILL_COOL=600s 再压 10 分钟。
          #   修法：kill 按 why 分级 + 保留 lst + 网络冷却 90s + 未达阈值 20s 快速重试。
          strings bs_unlock.dylib | grep -q "keep modules" || (echo "MISSING v6.39 net-loss keep-modules banner" && exit 1)
          strings bs_unlock.dylib | grep -q "transient net loss, will auto-resume" || (echo "MISSING v6.39 keep-modules reason" && exit 1)
          strings bs_unlock.dylib | grep -q "resumable=%d, lst=%d" || (echo "MISSING v6.39 resumable+lst log" && exit 1)
          strings bs_unlock.dylib | grep -q "killswitch-stop-resumable" || (echo "MISSING v6.39 resumable ar state" && exit 1)
          strings bs_unlock.dylib | grep -q "kill-cool-net" || (echo "MISSING v6.39 net kill cooldown state" && exit 1)
          strings bs_unlock.dylib | grep -q "tolerate, keep modules" || (echo "MISSING v6.39 tolerance log" && exit 1)
          strings bs_unlock.dylib | grep -q "tick=%ds fast=%ds" || (echo "MISSING v6.39 puller tick banner" && exit 1)
          # ===== v6.40（2026-10-27）：disarm 没认自己人 → 断网恢复仍不自启 =====
          #   216 真机：v6.39 前三条链路全生效，第四条被 :5998 的兜底 kind=2 抹掉。
          #   修法：拆 kind=6（网络故障停）+ 三处加 g_kill_sent/g_kill_resumable 自我认领。
          strings bs_unlock.dylib | grep -q "stop evidence = OUR killswitch" || (echo "MISSING v6.40 self-kill claim in stall scan" && exit 1)
          strings bs_unlock.dylib | grep -q "skip disarm (keep armed=" || (echo "MISSING v6.40 skip-disarm action" && exit 1)
          strings bs_unlock.dylib | grep -q "network failure (kind=6)" || (echo "MISSING v6.40 kind=6 network-fail class" && exit 1)
          strings bs_unlock.dylib | grep -q "center-stop is OUR killswitch" || (echo "MISSING v6.40 matrix self-kill bypass" && exit 1)
          strings bs_unlock.dylib | grep -q "NOT gating, proceed" || (echo "MISSING v6.40 live-check self-kill bypass" && exit 1)
          strings bs_unlock.dylib | grep -q "tcp connect server timeout" || (echo "MISSING v6.40 net-fail signature" && exit 1)
          # 反回归：v6.40 之后 disarm 那两个分支必须仍然存在（人停照样要 gate）
          strings bs_unlock.dylib | grep -q "auto-resume OFF until next Run" || (echo "MISSING center-stop disarm (regressed!)" && exit 1)
          strings bs_unlock.dylib | grep -q "resume BLOCKED: live agent.log says center/user stop" || (echo "MISSING live center-stop gate (regressed!)" && exit 1)
          # 反回归：网络类 kill 不许再带 wipe
          if strings bs_unlock.dylib | grep -q "TRIGGERED (%s) miss=%d -> stop script + wipe always"; then echo "FORBIDDEN: unconditional wipe banner" && exit 1; fi
          # v6.30：repair 成功档改「600s + 滚动预算」—— 修好后厂商再换包不再空窗 1h
          strings bs_unlock.dylib | grep -q "repair cooldown -> %ds" || (echo "MISSING v6.30 budget cooldown log" && exit 1)
          strings bs_unlock.dylib | grep -q "in %ds window" || (echo "MISSING v6.30 window log" && exit 1)
          # v6.29-1：repair 冷却两档（失败 60s / 成功 3600s）—— 换包后不再全网锁 1h
          strings bs_unlock.dylib | grep -q "retry in" || (echo "MISSING short repair retry log" && exit 1)
          # v6.29-2：token 空自愈 —— v6.41 起改为「设备码未就位就 defer」，
          #   不再按 hw.serial/随机数造号（造号是 v6.41 明确废除的做法）
          strings bs_unlock.dylib | grep -q "token empty: dev_id not ready -> defer" || (echo "MISSING v6.41 token-defer log" && exit 1)
          # v6.29-3：日志尾部保留式轮转（只清我们自己的 bs_unlock.log / bs_evt.log）
          strings bs_unlock.dylib | grep -q "\[log\] rotated" || (echo "MISSING log rotate log" && exit 1)
          # v6.29-4：pend 长期不收敛提醒（新包在盘上但脚本一直没重启）
          strings bs_unlock.dylib | grep -q "needs ONE script restart" || (echo "MISSING pend-stale warn" && exit 1)
          # v6.27：密文包长度自适应（厂商包首 4 字节 = 明文总长，208 只是其中一种，
          # 实测同一批客户端有发 192 的 —— 硬等 208 会 30s 超时 auth failed）
          strings bs_unlock.dylib | grep -q "cmd pkt len=" || (echo "MISSING autolen log" && exit 1)
          strings bs_unlock.dylib | grep -q "hdr probe fail" || (echo "MISSING probe-fail log" && exit 1)
          # ===== v6.41（2026-10-29）：设备码单一真源 —— 卸载/重装/覆盖 bspath 都不变号 =====
          #   旧版三级回退（hw.serial→.bs_devid 随机→token→"unknown"）全部删除。
          #   新链路：dlsym(g_script_dev_id/get_script_dev_id) 取 Agent 权威值
          #          → 钉盘 /var/mobile/Media/.bsdeveid → 冷启窗口 set 回 Agent。
          #   取不到就 PENDING 不绑卡不上报（宁可没号，绝不自己造号）。
          strings bs_unlock.dylib | grep -q "bsp-deveid-v1" || (echo "MISSING v6.41 pin file magic" && exit 1)
          strings bs_unlock.dylib | grep -q "refuse to invent" || (echo "MISSING v6.41 refuse-to-invent guard" && exit 1)
          strings bs_unlock.dylib | grep -q "\[deveid\] PENDING" || (echo "MISSING v6.41 pending banner" && exit 1)
          strings bs_unlock.dylib | grep -q "authoritative=%.32s (src=agent, pin=%s)" || (echo "MISSING v6.41 authoritative resolve log" && exit 1)
          strings bs_unlock.dylib | grep -q "src=agent.dev_id) conf_write=%d" || (echo "MISSING v6.41 identity tick conf write" && exit 1)
          strings bs_unlock.dylib | grep -q "restore skipped (setter unavailable)" || (echo "MISSING v6.41 setter-absent path" && exit 1)
          # 反回归：v6.41 之后不许再出现任何"本地造号"痕迹
          if strings bs_unlock.dylib | grep -q "src=local-gen"; then echo "FORBIDDEN: v6.41 local-gen devid still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q ".bs_devid"; then echo "FORBIDDEN: v6.41 legacy .bs_devid path still present" && exit 1; fi
          # ===== v6.42（2026-10-29）：卡密判决的两处误判修正 =====
          #   ① 设备码 PENDING 期不否决：没有服务端裁决 ≠ 卡无效。
          #      旧行为会在冷启窗口直接 BLOCKED → OPER_STOP + 每 3s 抹模块 → bs_module_lost。
          #   ② code=7 拉黑后每 ≥10min 发一次不带 act 的探活心跳：
          #      云端把卡改绑回来后能自动恢复，不再依赖人工换卡/重装。
          strings bs_unlock.dylib | grep -q "verdict HELD: device_id pending" || (echo "MISSING v6.42 pending-hold verdict" && exit 1)
          strings bs_unlock.dylib | grep -q "blacklisted card re-bound on server" || (echo "MISSING v6.42 blacklist probe recovery" && exit 1)
          strings bs_unlock.dylib | grep -q "waiting for new input or server re-bind (probe %lds)" || (echo "MISSING v6.42 blacklist probe gap log" && exit 1)
          # 反回归：v6.42 之后不许再出现"设备码没就位也照判封禁"的旧形态
          if strings bs_unlock.dylib | grep -q "int blocked = verdict_ok ? 0 : 1"; then echo "FORBIDDEN: v6.42 old one-line verdict still present" && exit 1; fi
          # ===== v6.42c（2026-10-29）：探活成功那一拍不再补打误导性 waiting 行 =====
          #   .216 实测：recovered 之后紧跟一行 "waiting for new input or server
          #   re-bind"，日志看起来像没恢复。修法是打印前复查 g_card_kicked。
          # ===== v6.42d（2026-10-29）：中控「授权」列（g_agent_auth_state）真实性 =====
          #   背景：中控两列来自两个不同全局 —— 「授权」=g_agent_auth_state、
          #   「到期」=g_agent_auth_valid_time。旧版只同步后者 ⇒ 云端删卡后到期空、
          #   授权仍「已授权」（21:06 .216 实测）。v6.42d 每拍按 verdict_ok 写前者。
          strings bs_unlock.dylib | grep -q "v6.52" || (echo "MISSING v6.52 banner" && exit 1)
          strings bs_unlock.dylib | grep -q "vendor auth_state found, now=%d" || (echo "MISSING auth_state dlsym log" && exit 1)
          strings bs_unlock.dylib | grep -q "auth_state %d -> %d (verdict=%s -> center auth column)" || (echo "MISSING auth_state sync log" && exit 1)
          strings bs_unlock.dylib | grep -q "vendor auth_state symbol NOT found" || (echo "MISSING auth_state fallback log" && exit 1)
          # ===== v6.42e（2026-10-29）：厂商每 48s 把 auth_state 写回 0 → 中控闪「已授权」 =====
          strings bs_unlock.dylib | grep -q "st setter write nop (0xd8fc) -> display ours" || (echo "MISSING st setter nop log" && exit 1)
          # ===== v6.42f（2026-10-29）：卡已过期时保留到期时间戳（中控显示「未授权 + 过期时间」）=====
          #   用户拍板：到期列有值 = 绑过卡但过期；空 = 从没绑过 / 被删 / 被接管。
          #   实现：心跳 rc==3 只清 lastok（阻断宽限），expire 保留 → 中控照旧显示哪天过期。
          strings bs_unlock.dylib | grep -q "expired (code=3) -> keep valid_time=" || (echo "MISSING v6.42f expired-keep log" && exit 1)
          # ===== v6.42g（2026-10-29）：code=0 但 expires_ts 已过去时不许宽限续命 =====
          #   桩测实证：`login OK expire=1793000000` 紧接着
          #   `re-authorized (expire=1793000000) -> gates open` —— 一张早就过期的卡
          #   被宽限判成已授权，中控显示「已授权 + 过去的时间」。修法：exp<=now 时 lastok=0。
          strings bs_unlock.dylib | grep -q "login OK expire=%ld lastok=%ld" || (echo "MISSING v6.42g lastok log" && exit 1)
          # ===== v6.42h（2026-10-29）：输错卡不许掐死有效卡的心跳 =====
          #   桩测实证：误输不存在的卡（code=1）→ 该卡进 last_fail，每 60s 重试一次，
          #   旧代码每次都 `last_check = now`，60s < cardtick 120s ⇒ 心跳永不触发
          #   （.216 连续 3 分钟零次真卡心跳）。修法：只有激活成功才抑制心跳。
          strings bs_unlock.dylib | grep -q "input rejected code=%ld -> keep current card" || (echo "MISSING v6.42h bad-card log" && exit 1)
          # ===== v6.44（2026-10-30）：抢别人的卡被拒，不许把自己的卡弄丢 =====
          #   现场事故（.216）：本机正绑 SNAILDQ… 正常跑，运营又输入别人已绑的
          #   SNAIL2K0…（act=new 被云 v3.26 拒 code=7），旧代码无条件清
          #   g_card_cur/expire/lastok ⇒ verdict=invalid ⇒ OPER_STOP + 抹 3 个模块
          #   ⇒ 中控掉成「未授权」。实际自己那张卡毫发无伤。
          #   修法：仅当 card == g_card_cur 时才清（那种归心跳 code=7 分支）。
          strings bs_unlock.dylib | grep -q "already activated on another device, refused (no auto-rebind)" || (echo "MISSING v6.44 refuse-no-rebind log" && exit 1)
          strings bs_unlock.dylib | grep -q "keep current card, heartbeat unaffected" || (echo "MISSING v6.44 keep-current-card log" && exit 1)
          # ===== v6.46（2026-10-30）：把状态/卡密冲突直接写进 BBCenter 中控「备注」列 =====
          #   协议实测：总长4B | 07 00 | 01 | 状态位1B | 到期4B | 01 02 0000 | 指纹4B | 01
          #             | 备注 UTF-8。中控 RVA 0xb2a4 cmp rax,0x15，>21 取 [0x15:] 进备注列。
          #   ① 中控按源 IP 归属设备，指纹 4B 不校验；② 一个连接只处理第一个包；
          #   ③ 非阻塞 connect(select 2s) 防卡住 cardwatch；④ 必须 SO_NOSIGPIPE。
          strings bs_unlock.dylib | grep -q "note] -> %s:%d" || (echo "MISSING v6.46 center-note log" && exit 1)
          strings bs_unlock.dylib | grep -q "note] reused app socket fd=%d" || (echo "MISSING v6.46 reuse-app-socket log" && exit 1)

          # ===== v6.47（2026-10-30）：卡密冲突只报一次 + 解除后必须覆盖 =====
          #   用户拍板：① 每次中控输激活码撞卡密冲突只上报一次（不要 45s 复读）；
          #   ② A 机撞冲突后又输了一张没人绑定的卡（激活成功）→ 中控备注里那条
          #      冲突文案不会自己消失，必须立刻覆盖成当前真实状态，否则误导判断。
          #   实现：g_note_conflict_sent 记忆已报（换卡号才允许再报）+ g_note_force
          #        走 15s 快通道。四个解除点：激活成功 / 真输入解除拉黑 /
          #        探活恢复 / 重输本机原卡。
          strings bs_unlock.dylib | grep -q "conflict cleared by new card -> repush center note" || (echo "MISSING v6.47 conflict-clear repush log" && exit 1)
          strings bs_unlock.dylib | grep -q "own card re-input after conflict -> clear flag on center" || (echo "MISSING v6.47 own-card-reinput log" && exit 1)
          # ===== v6.49（2026-10-30 03:40 .98 实测）：备注主状态与「授权」列同源 =====
          #   用户报障：输了一张别人已绑的卡之后，中控那一行 = 「已授权 ｜ 本机卡密已被其他设备接管」，
          #   两个字段自相矛盾。根因是备注文案只看 g_card_cur/expire，而授权列看 verdict_ok（含宽限），
          #   两边各算各的；再加上发送失败不重试 → 旧文案永久残留。
          #   修法：bs_note_verdict_ok() 与授权列同一判据；valid=1 时文案只可能是「正常 …」，
          #        负面文案只允许在 valid=0 出现；状态一变 3s 内覆盖；发送失败 30s 重试。
          #   ★ 断言一律用**英文串**：strings 只吐 >=4 字节可打印 ASCII，UTF-8 中文会被
          #     整段丢掉；而且 run 脚本里的中文字面量在 macOS runner 上还有编码风险
          #     （2026-10-30 03:50 run 40941411263 / 03:56 run 40941600888 连续两次栽在这，
          #      编译与功能全过，只挂断言）。
          # v6.52 起「备注只报冲突」，v6.49 的 valid-conflict 标记文案已随分支删除
          strings bs_unlock.dylib | grep -q "already activated on another device" || (echo "MISSING v6.44 refuse-no-rebind whole-line" && exit 1)
          # ----- v6.48（2026-10-30 03:20 .216 实测修正）：备注侧冲突记忆必须独立 -----
          #   v6.47 拿 g_card_kicked 当备注判据，实测**抖**：运营输的那张别人卡就躺在
          #   agent.log 尾部，日志扫描每拍都判成「真重新输入」→ 解除拉黑把 kicked 清空，
          #   下一拍撞 code=7 又写回。结果备注一直显示「正常 v6.47」，从没出现过冲突文案
          #   （.216 03:10 实证：conflict 后 15s 推出去的是 正常 v6.47 到期11-28）。
          #   修法：备注侧另存 g_note_cf_card/ts/evt/sent 四个量，与 g_card_kicked 解耦；
          #         `g_note_force` 只在三个真解除点置位（激活成功 / 探活恢复 / 重输本机原卡），
          #         取消「newer input seen after kick」分支里的 force（那一拍每 3 秒都命中）。
          if strings bs_unlock.dylib | grep -q "v6\.46"; then echo "FORBIDDEN: stale v6.46 banner still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6\.47"; then echo "FORBIDDEN: stale v6.47 banner still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6\.48"; then echo "FORBIDDEN: stale v6.48 banner still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6\.49"; then echo "FORBIDDEN: stale v6.49 banner still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6\.50"; then echo "FORBIDDEN: stale v6.50 banner still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6\.51"; then echo "FORBIDDEN: stale v6.51 banner still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6\.44"; then echo "FORBIDDEN: stale v6.44 banner still present" && exit 1; fi

          # ===== v6.50（2026-10-30 04:20）：备注上报不得干扰原厂「运行」列 =====
          #   用户报障（.216）：中控下发运行、脚本确实在跑，但 BBCenter「运行」列一直「空闲」。
          #   根因（反汇编 BBCenter 实证）：解析函数 RVA 0xb184 起
          #       movzx ecx,[rax+7] → mov [rdi+0xb8],ecx ；填表 RVA 0x29ad0 再搬到列 +0x80。
          #   而我们 v6.45~v6.49 把 pkt[7] 写成死值 0x00 → 每推一次备注就把运行列刷成空闲。
          #   修法：① pkt[7] = bs_center_run_flag()（OFF_RUN 实时值），运行态翻转即补推；
          #         ② 正常态去掉 300s 无脑保底重推（只在文案变化/运行态翻转/force 时发），
          #            避免反复覆盖原厂自己写进备注的内容；异常态保留 300s 保底。
          strings bs_unlock.dylib | grep -q "run=%d" || (echo "MISSING v6.50 note run-state log" && exit 1)
          # ===== v6.52（2026-10-30 04:35）：备注只报卡密冲突，非冲突态零发包 =====
          strings bs_unlock.dylib | grep -q "(clear remark)" || (echo "MISSING v6.52 note clear-remark log" && exit 1)
          if strings bs_unlock.dylib | grep -q "v6\.42h"; then echo "FORBIDDEN: stale v6.42h banner still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6\.42g"; then echo "FORBIDDEN: stale v6.42g banner still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6\.42f"; then echo "FORBIDDEN: stale v6.42f banner still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6\.42e"; then echo "FORBIDDEN: stale v6.42e banner still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6\.42d"; then echo "FORBIDDEN: stale v6.42d banner still present" && exit 1; fi
          if strings bs_unlock.dylib | grep -q "v6\.42c"; then echo "FORBIDDEN: stale v6.42c banner still present" && exit 1; fi
          # v6.25j：消费式缓冲修复的特征串（粘包尾巴不再被整块丢弃）
          strings bs_unlock.dylib | grep -q "conn pkts=\[" || (echo "MISSING conn-pkts" && exit 1)
          strings bs_unlock.dylib | grep -q "rx buffer full" || (echo "MISSING rx-buffer-full" && exit 1)
          strings bs_unlock.dylib | grep -q "not in allowlist" || (echo "MISSING offline egress allowlist" && exit 1)
          strings bs_unlock.dylib | grep -q "allowlisted pc" || (echo "MISSING stat redirect under offline" && exit 1)
          strings bs_unlock.dylib | grep -q "was stall ofn=%d" || (echo "MISSING cross-process recovery event" && exit 1)
          strings bs_unlock.dylib | grep -q "hb carries of=stall" || (echo "MISSING live of/ofn recompute" && exit 1)
          strings bs_unlock.dylib | grep -q "consecutive protocol errors" || (echo "MISSING protocol stall alarm" && exit 1)
          strings bs_unlock.dylib | grep -q "stub idle %ds -> close" || (echo "MISSING stub idle timeout" && exit 1)
          strings bs_unlock.dylib | grep -q ".bs_off_state" || (echo "MISSING cross-process stall state" && exit 1)
          strings bs_unlock.dylib | grep -q "recovered: accepted again after" || (echo "MISSING stall recovery" && exit 1)
          strings bs_unlock.dylib | grep -q "of=%s&ofn=%d" || (echo "MISSING of/ofn hb param" && exit 1)
          if strings bs_unlock.dylib | grep -q "auto-reload: request STOP"; then echo "FORBIDDEN: [rl] auto-reload still present" && exit 1; fi
          strings bs_unlock.dylib | grep -q "kicked=" || (echo "MISSING kicked field" && exit 1)
          strings bs_unlock.dylib | grep -q "newer input seen after kick" || (echo "MISSING unblock path" && exit 1)
          # v6.28：设备端「运行中 → 自己停」自动接上（严格版，中控下发停止不接）
          strings bs_unlock.dylib | grep -q "RUNNING observed (st=%p" || (echo "MISSING ar running marker" && exit 1)
          strings bs_unlock.dylib | grep -q "resume #%d" || (echo "MISSING ar resume" && exit 1)
          strings bs_unlock.dylib | grep -q "auto-resume OFF until next Run" || (echo "MISSING ar disarm on center stop" && exit 1)
          strings bs_unlock.dylib | grep -q "lst=%d" || (echo "MISSING ar lst in stall scan" && exit 1)
          if strings bs_unlock.dylib | grep -q "kept STOPPED, press Run in center"; then echo "FORBIDDEN: v6.24p kept-stopped banner still present" && exit 1; fi
          strings bs_unlock.dylib | grep -q "stall scan: run=" || (echo "MISSING stall diag" && exit 1)
          strings bs_unlock.dylib | grep -q "so=%.8s pend=%d" || (echo "MISSING so state in stall scan" && exit 1)
          strings bs_unlock.dylib | grep -q "src=evt" || (echo "MISSING event log channel" && exit 1)
          strings bs_unlock.dylib | grep -q "bs_evt.log" || (echo "MISSING evt log path" && exit 1)
          strings bs_unlock.dylib | grep -q "new so applied (script started" || (echo "MISSING pend clear point" && exit 1)
          strings bs_unlock.dylib | grep -q "can not find version key" || (echo "MISSING loadfail sig" && exit 1)
          strings bs_unlock.dylib | grep -q "prewarm done" || (echo "MISSING key prewarm" && exit 1)
          strings bs_unlock.dylib | grep -q "auto-start gated until run=1" || (echo "MISSING userstop gate" && exit 1)
          strings bs_unlock.dylib | grep -q "agent stop script" || (echo "MISSING user-stop sig" && exit 1)
          strings bs_unlock.dylib | grep -q "self-stop, ar will decide" || (echo "MISSING sjz freshness guard" && exit 1)
          strings bs_unlock.dylib | grep -q "s2] applied" || (echo "MISSING s2 apply" && exit 1)
          strings bs_unlock.dylib | grep -q "s2] connect" || (echo "MISSING s2 connect redirect" && exit 1)
          strings bs_unlock.dylib | grep -q "s2] dns" || (echo "MISSING s2 pseudo-dns" && exit 1)
          strings bs_unlock.dylib | grep -q "s2] cleared" || (echo "MISSING s2 clear path" && exit 1)
          strings bs_unlock.dylib | grep -q "vendor passthrough" || (echo "MISSING s2 vendor mode" && exit 1)
          strings bs_unlock.dylib | grep -q "server2 fully in-process, zero vendor traffic" || (echo "MISSING offline banner" && exit 1)
          strings bs_unlock.dylib | grep -q "intercepted -> in-proc stub" || (echo "MISSING offline connect intercept" && exit 1)
          strings bs_unlock.dylib | grep -q "vendor chain fully bypassed" || (echo "MISSING offline accepted marker" && exit 1)
          strings bs_unlock.dylib | grep -q "R captured" || (echo "MISSING SecKeyEncrypt R capture" && exit 1)
          strings bs_unlock.dylib | grep -q "key recovered (R=0x" || (echo "MISSING offline key recovery" && exit 1)
          strings bs_unlock.dylib | grep -q "no devid, reply with template code" || (echo "MISSING offline devid fallback" && exit 1)
          strings bs_unlock.dylib | grep -q "devid=%s (src=conf)" || (echo "MISSING offline devid from conf" && exit 1)
          strings bs_unlock.dylib | grep -q "devid=%s (src=agent.log)" || (echo "MISSING offline devid from agent.log" && exit 1)
          strings bs_unlock.dylib | grep -q "RESP80 hex len=" || (echo "MISSING RESP80 length guard" && exit 1)
          strings bs_unlock.dylib | grep -q "5000000003004300000004" || (echo "MISSING RESP80 blob" && exit 1)
          otool -l bs_unlock.dylib | grep -q LC_CODE_SIGNATURE || (echo "NO LC_CODE_SIGNATURE" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: dylibs
          path: |
            bs_unlock.dylib
            bs_test.dylib
